# Netlify — GitHub continuous deploy
# Install ALL deps (including vite in devDependencies) before build.
# Skip Electron binary download — website does not need it.
[build]
  command = "npm install --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Prevent electron postinstall from downloading ~100MB binary on Netlify
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
  # Some CI environments omit devDependencies unless explicitly included
  NPM_FLAGS = "--include=dev"

# SPA fallback — fixes Netlify "Page not found" on refresh / deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
